[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Client dashboard UI is copied into the server image; skip-watch on
# server/** alone left Header-only commits undeployed.
# Retrigger after Railway Snapshot-code timeouts (2026-08-18 incident).
watchPatterns = ["client/**", "server/**", "package.json", "Dockerfile", "railway.toml"]

[deploy]
# Root npm start → server workspace (migrate runs after listen inside Node).
startCommand = "npm start"
healthcheckPath = "/api/health"
# Listen-first boot; generous timeout so cold starts still pass probes.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
