[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Client dashboard UI is copied into the server image; skip-watch on
# server/** alone left Header-only commits undeployed.
# Retrigger after Railway Snapshot-code timeouts (2026-08-18 incident).
watchPatterns = ["client/**", "server/**", "package.json", "Dockerfile", "railway.toml"]

[deploy]
# Skip npm workspace indirection — start Node directly on the built server.
startCommand = "node server/dist/index.js"
healthcheckPath = "/api/health"
# Cold start used to run `prisma migrate deploy` before listen, so /api/health
# stayed dark past 30s and Railway marked redeploys FAILED. Listen first now;
# keep a generous timeout as a safety net for slow boots.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
